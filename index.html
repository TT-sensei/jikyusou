<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><title>持久走チャレンジ</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head><body>
<main id="app" class="app-shell"><header class="hero"><p class="eyebrow" id="gradeLabel"></p><h1 id="pageTitle">持久走チャレンジ</h1><p class="meta" id="courseMeta"></p><label class="name-field">なまえ<input id="nameInput" type="text" maxlength="20" autocomplete="name" placeholder="入力"></label></header><section class="goal-panel" aria-label="自分の目標"><div><p class="goal-panel__label">自分の目標</p><p class="goal-panel__value"><strong id="personalGoalDisplay">10,000</strong><span id="personalGoalUnit">m</span></p><p id="goalText" class="goal-text hidden"></p></div><div class="goal-input-group"><label class="goal-input">目標を入力<div class="goal-input__row"><input id="personalGoalInput" type="number" min="100" max="999999" step="100" inputmode="numeric" placeholder="10000"><select id="personalGoalUnitSelect" aria-label="目標の単位"><option value="m">m</option><option value="lap">周</option></select></div></label><label class="goal-text-input">ひとこと<input id="goalTextInput" type="text" maxlength="40" placeholder="あきらめないでがんばる"></label></div></section>
<section class="card record-card"><h2>きょうの周回</h2><div class="lap-counter"><button class="round-button" id="minusHalfBtn" type="button" aria-label="半周減らす">−<small>半周</small></button><button class="round-button" id="minusBtn" type="button" aria-label="1周減らす">−<small>1周</small></button><div class="lap-value"><strong id="pendingLaps">0</strong><span id="pendingLapsUnit">周</span></div><button class="round-button" id="plusBtn" type="button" aria-label="1周増やす">＋<small>1周</small></button><button class="round-button" id="plusHalfBtn" type="button" aria-label="半周増やす">＋<small>半周</small></button></div><p class="pending-distance" id="pendingDistance">0 m</p><button class="primary-button" id="recordBtn" type="button">記録する</button><p class="today-summary" id="todaySummary"></p></section>
<section class="card total-card"><div class="section-heading"><h2>これまでの記録</h2><span id="goalLabel" class="goal-label"></span></div><div class="stat-grid"><div class="stat"><strong id="totalLaps">0</strong><span>周</span></div><div class="stat"><strong id="totalDistance">0</strong><span>m</span></div></div><div class="progress"><div id="progressFill" class="progress__fill"></div></div><p class="progress-label" id="progressLabel"></p></section>
<section class="card medal-card"><div class="section-heading"><h2>メダル</h2><span class="section-note">達成したらタップ</span></div><div id="medalGrid" class="medal-grid"></div></section>
<button id="historyToggle" class="text-button" type="button" aria-expanded="false">記録の一覧を見る</button><ul id="historyList" class="history-list hidden"></ul></main>
<button id="settingsBtn" class="settings-button" type="button" aria-label="設定">⚙</button>
<dialog id="certificateDialog" class="dialog"><div class="dialog__body"><canvas id="certificateCanvas" width="1200" height="850"></canvas><div class="dialog__actions"><button id="downloadCertificate" class="primary-button" type="button">画像として保存</button><button id="printCertificate" class="secondary-button" type="button">印刷する</button></div><button id="closeCertificate" class="text-button" type="button">とじる</button></div></dialog>
<dialog id="awardDialog" class="dialog award-dialog"><div class="award__body"><p class="award__eyebrow">メダルゲット！</p><div id="awardBurst" class="award__burst"><img id="awardImage" alt=""><span id="awardPlaceholder"></span></div><h2 id="awardTitle"></h2><p id="awardText"></p><button id="awardNext" class="primary-button" type="button">つぎのメダル</button></div></dialog><dialog id="settingsDialog" class="dialog"><div class="dialog__body"><h2>設定</h2><dl id="settingsInfo" class="settings-list"></dl><div class="settings-controls"><label>メダルの単位<select id="medalUnitSelect"><option value="m">m</option><option value="lap">周</option></select></label><label>メダルコレクション<select id="collectionSelect"></select></label></div><button id="resetBtn" class="danger-button" type="button">記録をリセット</button><button id="closeSettings" class="text-button" type="button">とじる</button></div></dialog>
<script src="data/config.js"></script><script src="data/medal-collections.js"></script><script src="data/medals.js"></script><script src="js/storage.js"></script><script src="js/records.js"></script><script src="js/medals.js"></script><script src="js/certificate.js"></script><script src="js/settings.js"></script><script src="js/ui.js"></script><script src="js/award.js"></script><script src="js/app.js"></script></body></html>
